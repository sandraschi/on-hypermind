[book]
slug = "on-hypermind"
title = "On Hypermind"
subtitle = "The Dissolution of the Ego, Exocortices, and the Cognitive Meat-Trap"
author = "Sandra Schipal"
identifier = "urn:uuid:7d9e2f4a-3b1c-4e8a-9f0d-5c7a1b2e3f4a"
language = "en"
port = 11169
theme = "violet"
blurb = "If hyperwar takes the battlefield, takeover takes the economy, hyperart takes the sublime, and metacraft takes the machine - what happens to the biological monkey watching it all? Ten chapters on the exocortex inversion, the end of human epistemology, and synthetic drift."

[chapters]
