  "05-locating-the-present.md",
  "06-thresholds.md",
  "07-control-case.md",
  "08-terminal-states.md",
  "09-day-two.md",
  "10-corpus.md",
  "side-glossary.md",
  "side-embodiment.md",
  "side-what-scifi-gets-wrong.md",
]
front_matter = ["00-preface.md"]
expected = [
  "01-exocortex-inversion.md", "02-end-of-epistemology.md", "03-synthetic-drift.md", "04-the-ladder.md",
  "05-locating-the-present.md", "06-thresholds.md", "07-control-case.md", "08-terminal-states.md",
  "09-day-two.md", "10-corpus.md",
